<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ddog 캐시 초기화</title>
<style>
  body {
    font-family: -apple-system, sans-serif;
    background: #1a1a1a;
    color: #eee;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    padding: 20px;
    box-sizing: border-box;
    text-align: center;
  }
  h1 { font-size: 18px; margin-bottom: 8px; }
  p { font-size: 14px; color: #aaa; margin-bottom: 24px; }
  button {
    background: #4caf50;
    color: white;
    border: none;
    padding: 16px 32px;
    font-size: 16px;
    border-radius: 10px;
    cursor: pointer;
    width: 100%;
    max-width: 320px;
  }
  button:disabled { background: #555; }
  #status {
    margin-top: 20px;
    font-size: 14px;
    white-space: pre-line;
  }
  .ok { color: #4caf50; }
  .err { color: #e05c6a; }
</style>
</head>
<body>
  <h1>ddog 캐시 초기화</h1>
  <p>"ddog-cache" 로컬 캐시만 삭제합니다.<br>다른 사이트 데이터는 건드리지 않습니다.</p>
  <button id="btn">캐시 삭제 실행</button>
  <div id="status"></div>

  <script>
    const DB_NAME = 'ddog-cache';
    const btn = document.getElementById('btn');
    const status = document.getElementById('status');

    btn.addEventListener('click', () => {
      btn.disabled = true;
      status.textContent = '삭제 중...';
      status.className = '';

      const req = indexedDB.deleteDatabase(DB_NAME);

      req.onsuccess = () => {
        status.textContent = '완료되었습니다.\nddog 앱으로 돌아가서 새로고침 해주세요.';
        status.className = 'ok';
      };
      req.onerror = () => {
        status.textContent = '삭제 실패. 다시 시도해주세요.';
        status.className = 'err';
        btn.disabled = false;
      };
      req.onblocked = () => {
        status.textContent = 'ddog 앱이 다른 탭에서 열려있으면 차단됩니다.\n그 탭을 닫고 다시 시도해주세요.';
        status.className = 'err';
        btn.disabled = false;
      };
    });
  </script>
</body>
</html>
