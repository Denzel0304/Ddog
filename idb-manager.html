<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>똑비서 — 로컬 캐시 관리</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --border: #2a2d3a;
    --accent: #6c8fff;
    --danger: #ff5a5a;
    --ok: #4caf89;
    --warn: #f0a500;
    --text: #e8eaf0;
    --muted: #6b7080;
    --font: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    min-height: 100dvh;
    padding: 24px 16px 48px;
  }

  header {
    text-align: center;
    margin-bottom: 28px;
  }
  header h1 {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.3px;
    color: var(--text);
  }
  header p {
    margin-top: 6px;
    font-size: 13px;
    color: var(--muted);
    line-height: 1.6;
  }

  /* 상태 배지 */
  #status-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 16px;
    font-size: 13px;
  }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .dot.online  { background: var(--ok); }
  .dot.offline { background: var(--danger); }

  /* 버튼 그룹 */
  .btn-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  button {
    font-family: var(--font);
    font-size: 14px;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    padding: 11px 16px;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
    flex: 1;
  }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .btn-primary  { background: var(--accent); color: #fff; }
  .btn-danger   { background: var(--danger); color: #fff; }
  .btn-ghost    { background: var(--surface); color: var(--text); border: 1px solid var(--border); }

  /* 필터 탭 */
  #filter-row {
    display: flex;
    gap: 6px;
    margin-bottom: 14px;
  }
  .filter-btn {
    flex: 1;
    padding: 8px 6px;
    font-size: 12px;
    font-weight: 600;
    border-radius: 8px;
    background: var(--surface);
    color: var(--muted);
    border: 1px solid var(--border);
  }
  .filter-btn.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  /* 선택 카운트 */
  #select-bar {
    display: none;
    align-items: center;
    justify-content: space-between;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 12px;
    font-size: 13px;
  }
  #select-bar.visible { display: flex; }
  #select-bar span { color: var(--muted); }
  #select-bar strong { color: var(--danger); }

  /* 목록 */
  #list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    transition: border-color 0.15s;
  }
  .item.ghost {
    border-color: var(--danger);
    background: rgba(255,90,90,0.06);
  }
  .item.selected {
    border-color: var(--accent);
    background: rgba(108,143,255,0.08);
  }

  .item input[type=checkbox] {
    width: 18px; height: 18px;
    flex-shrink: 0;
    margin-top: 2px;
    accent-color: var(--accent);
    cursor: pointer;
  }

  .item-body { flex: 1; min-width: 0; }
  .item-title {
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 4px;
  }
  .item-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .badge {
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 6px;
    font-weight: 500;
  }
  .badge-date  { background: rgba(255,255,255,0.07); color: var(--muted); }
  .badge-ghost { background: rgba(255,90,90,0.18); color: var(--danger); }
  .badge-ok    { background: rgba(76,175,137,0.18); color: var(--ok); }
  .badge-id    { background: rgba(255,255,255,0.05); color: var(--muted); font-family: monospace; }

  /* 빈 상태 */
  .empty {
    text-align: center;
    padding: 48px 0;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.8;
  }
  .empty-icon { font-size: 36px; margin-bottom: 10px; }

  /* 토스트 */
  #toast {
    position: fixed;
    bottom: 32px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #2a2d3a;
    color: var(--text);
    font-size: 13px;
    padding: 10px 20px;
    border-radius: 24px;
    opacity: 0;
    transition: opacity 0.2s, transform 0.2s;
    pointer-events: none;
    white-space: nowrap;
    border: 1px solid var(--border);
    z-index: 999;
  }
  #toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* 로딩 스피너 */
  .spinner {
    display: inline-block;
    width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.2);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  hr { border: none; border-top: 1px solid var(--border); margin: 20px 0; }
</style>
</head>
<body>

<header>
  <h1>🗄 로컬 캐시 관리</h1>
  <p>IndexedDB에 저장된 할일 목록을 확인하고<br>불필요한 항목을 선택해서 삭제할 수 있어요.</p>
</header>

<div id="status-bar">
  <div class="dot" id="net-dot"></div>
  <span id="net-label">네트워크 확인 중...</span>
</div>

<div class="btn-row">
  <button class="btn-primary" id="btn-load">📋 목록 불러오기</button>
  <button class="btn-ghost" id="btn-compare" disabled>☁️ Supabase 비교</button>
</div>

<div id="filter-row" style="display:none">
  <button class="filter-btn active" data-filter="all">전체</button>
  <button class="filter-btn" data-filter="ghost">유령만 🔴</button>
  <button class="filter-btn" data-filter="ok">정상만 🟢</button>
</div>

<div id="select-bar">
  <span><strong id="sel-count">0</strong>개 선택됨</span>
  <button class="btn-danger" id="btn-delete-selected" style="flex:0;padding:8px 16px;font-size:13px">선택 삭제</button>
</div>

<div id="list">
  <div class="empty">
    <div class="empty-icon">📋</div>
    "목록 불러오기"를 눌러주세요
  </div>
</div>

<div id="toast"></div>

<script>
// ── 설정 ──
const SUPABASE_URL = 'https://rcfayyhlgxubuakxhrxy.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJjZmF5eWhsZ3h1YnVha3hocnh5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4NDQ4MjYsImV4cCI6MjA5MTQyMDgyNn0.j7YtqXfN0zxM-35RLGcjcw47uq83etMjJbHip4td4xg';
const IDB_NAME    = 'ddog-cache';
const IDB_VERSION = 1;
const TABLE_NAME  = 'ddog';

// ── 상태 ──
let allItems    = [];   // IDB 전체
let sbIds       = null; // Supabase id Set (비교 후)
let currentFilter = 'all';

// ── 네트워크 상태 ──
function updateNetStatus() {
  const online = navigator.onLine;
  const jwt    = getAppJwt();
  document.getElementById('net-dot').className = 'dot ' + (online ? 'online' : 'offline');

  if (!online) {
    document.getElementById('net-label').textContent = '오프라인 — IDB 목록만 확인 가능';
  } else if (!jwt) {
    document.getElementById('net-label').textContent = '⚠️ 앱 세션 없음 — 앱에 먼저 로그인하세요';
  } else {
    document.getElementById('net-label').textContent = '온라인 · 세션 감지됨 — Supabase 비교 가능';
  }
  document.getElementById('btn-compare').disabled = !online || !jwt;
}
updateNetStatus();
window.addEventListener('online',  updateNetStatus);
window.addEventListener('offline', updateNetStatus);

// ── IDB ──
function openIDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(IDB_NAME, IDB_VERSION);
    r.onsuccess = e => res(e.target.result);
    r.onerror   = e => rej(e.target.error);
  });
}
async function idbGetAll() {
  const db = await openIDB();
  return new Promise((res, rej) => {
    const tx  = db.transaction('todos', 'readonly');
    const req = tx.objectStore('todos').getAll();
    req.onsuccess = () => res(req.result || []);
    req.onerror   = () => rej(req.error);
  });
}
async function idbDeleteById(id) {
  const db = await openIDB();
  return new Promise((res, rej) => {
    const tx  = db.transaction('todos', 'readwrite');
    const req = tx.objectStore('todos').delete(id);
    req.onsuccess = () => res();
    req.onerror   = () => rej(req.error);
  });
}

// ── 앱 세션 JWT 읽기 ──
function getAppJwt() {
  try {
    const session = JSON.parse(localStorage.getItem('ddog_sb_session'));
    return session?.access_token || null;
  } catch(e) { return null; }
}

// ── Supabase id 목록 ──
async function fetchSbIds() {
  const jwt = getAppJwt();
  if (!jwt) throw new Error('앱 로그인 세션이 없어요. 앱에 먼저 로그인 후 이 페이지를 열어주세요.');

  const headers = {
    'apikey': SUPABASE_KEY,
    'Authorization': `Bearer ${jwt}`
  };

  let allIds = [];
  let offset = 0;
  const pageSize = 1000;
  while (true) {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/${TABLE_NAME}?select=id&limit=${pageSize}&offset=${offset}`,
      { headers }
    );
    if (!res.ok) throw new Error('Supabase 조회 실패: ' + res.status);
    const page = await res.json();
    if (!page || page.length === 0) break;
    allIds = allIds.concat(page.map(r => r.id));
    if (page.length < pageSize) break;
    offset += pageSize;
  }
  return new Set(allIds);
}

// ── 목록 불러오기 ──
document.getElementById('btn-load').addEventListener('click', async () => {
  const btn = document.getElementById('btn-load');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>불러오는 중...';
  try {
    allItems = await idbGetAll();
    sbIds = null; // 비교 초기화
    currentFilter = 'all';
    setFilterActive('all');
    document.getElementById('filter-row').style.display = 'flex';
    renderList();
    toast(`총 ${allItems.length}개 항목을 불러왔어요`);
  } catch(e) {
    toast('IDB 열기 실패: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '📋 목록 불러오기';
  }
});

// ── Supabase 비교 ──
document.getElementById('btn-compare').addEventListener('click', async () => {
  if (!allItems.length) { toast('먼저 목록을 불러오세요'); return; }
  const btn = document.getElementById('btn-compare');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>비교 중...';
  try {
    sbIds = await fetchSbIds();
    renderList();
    const ghostCount = allItems.filter(t => !sbIds.has(t.id)).length;
    toast(ghostCount > 0
      ? `⚠️ Supabase에 없는 항목 ${ghostCount}개 발견 (빨간색)`
      : '✅ 모든 항목이 Supabase와 일치해요');
  } catch(e) {
    toast('비교 실패: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '☁️ Supabase 비교';
  }
});

// ── 필터 ──
document.querySelectorAll('.filter-btn').forEach(b => {
  b.addEventListener('click', () => {
    currentFilter = b.dataset.filter;
    setFilterActive(currentFilter);
    renderList();
  });
});
function setFilterActive(f) {
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.filter === f);
  });
}
function getFiltered() {
  if (currentFilter === 'ghost' && sbIds) return allItems.filter(t => !sbIds.has(t.id));
  if (currentFilter === 'ok'    && sbIds) return allItems.filter(t =>  sbIds.has(t.id));
  return allItems;
}

// ── 렌더링 ──
function renderList() {
  const listEl = document.getElementById('list');
  listEl.innerHTML = '';

  const items = getFiltered();
  updateSelectBar();

  if (!items.length) {
    listEl.innerHTML = `<div class="empty"><div class="empty-icon">${currentFilter === 'ghost' ? '✅' : '📭'}</div>${
      currentFilter === 'ghost' ? '유령 데이터가 없어요!' : '항목이 없어요'
    }</div>`;
    return;
  }

  // 날짜 내림차순 정렬
  const sorted = [...items].sort((a, b) => (b.date || '') > (a.date || '') ? 1 : -1);

  sorted.forEach(todo => {
    const isGhost = sbIds ? !sbIds.has(todo.id) : false;

    const el = document.createElement('div');
    el.className = 'item' + (isGhost ? ' ghost' : '');
    el.dataset.id = String(todo.id);

    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.addEventListener('change', () => {
      el.classList.toggle('selected', cb.checked);
      updateSelectBar();
    });

    const body = document.createElement('div');
    body.className = 'item-body';

    const titleEl = document.createElement('div');
    titleEl.className = 'item-title';
    titleEl.textContent = todo.title || '(제목 없음)';

    const metaEl = document.createElement('div');
    metaEl.className = 'item-meta';

    const dateBadge = document.createElement('span');
    dateBadge.className = 'badge badge-date';
    dateBadge.textContent = todo.date || '날짜없음';
    metaEl.appendChild(dateBadge);

    if (isGhost) {
      const ghostBadge = document.createElement('span');
      ghostBadge.className = 'badge badge-ghost';
      ghostBadge.textContent = '☁️ Supabase에 없음';
      metaEl.appendChild(ghostBadge);
    } else if (sbIds) {
      const okBadge = document.createElement('span');
      okBadge.className = 'badge badge-ok';
      okBadge.textContent = '✓ 정상';
      metaEl.appendChild(okBadge);
    }

    const idBadge = document.createElement('span');
    idBadge.className = 'badge badge-id';
    idBadge.textContent = 'id: ' + String(todo.id).slice(0, 8) + '…';
    metaEl.appendChild(idBadge);

    body.appendChild(titleEl);
    body.appendChild(metaEl);
    el.appendChild(cb);
    el.appendChild(body);
    listEl.appendChild(el);
  });
}

// ── 선택 바 업데이트 ──
function updateSelectBar() {
  const checked = document.querySelectorAll('.item input[type=checkbox]:checked');
  const bar = document.getElementById('select-bar');
  document.getElementById('sel-count').textContent = checked.length;
  bar.classList.toggle('visible', checked.length > 0);
}

// ── 선택 삭제 ──
document.getElementById('btn-delete-selected').addEventListener('click', async () => {
  const checked = [...document.querySelectorAll('.item input[type=checkbox]:checked')];
  if (!checked.length) return;

  const ids = checked.map(cb => cb.closest('.item').dataset.id);

  // id 타입 복원 (숫자면 숫자로)
  const parsedIds = ids.map(id => isNaN(id) ? id : Number(id));

  const ok = confirm(`선택한 ${parsedIds.length}개 항목을 IDB에서 삭제할까요?\n(Supabase 데이터는 건드리지 않아요)`);
  if (!ok) return;

  const btn = document.getElementById('btn-delete-selected');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>삭제 중...';

  let failed = 0;
  for (const id of parsedIds) {
    try {
      await idbDeleteById(id);
      allItems = allItems.filter(t => String(t.id) !== String(id));
    } catch(e) {
      failed++;
      console.error('삭제 실패:', id, e);
    }
  }

  renderList();
  btn.disabled = false;
  btn.textContent = '선택 삭제';

  if (failed === 0) toast(`✅ ${parsedIds.length}개 삭제 완료`);
  else toast(`⚠️ ${parsedIds.length - failed}개 삭제, ${failed}개 실패`);
});

// ── 토스트 ──
function toast(msg, duration = 2800) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), duration);
}
</script>
</body>
</html>
